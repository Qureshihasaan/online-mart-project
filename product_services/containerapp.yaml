# Azure Container App configuration for the product service
apiVersion: 2023-05-02-preview
kind: ContainerApp
location: eastus
name: product-service
spec:
  template:
    containers:
    - name: product-service
      image: onlinemartcontainerregistry.azurecr.io/product-service:latest
      env:
      - name: PRODUCT_SERVICE_DATABASE_URL
        secretRef: product-db-url
      - name: KAFKA_BOOTSTRAP_SERVER
        value: onlinemartkafka.servicebus.windows.net:9093
      - name: KAFKA_PRODUCT_TOPIC
        value: product-topic
      - name: KAFKA_CONSUMER_GROUP_ID_FOR_PRODUCT
        value: product-group
      - name: KAFKA_SASL_MECHANISM
        value: PLAIN
      - name: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - name: KAFKA_SASL_JAAS_CONFIG
        secretRef: kafka-jaas-config
      resources:
        cpu: 1.0
        memory: 2Gi
  scale:
    minReplicas: 1
    maxReplicas: 10
  configuration:
    ingress:
      external: true
      targetPort: 8000
    secrets:
    - name: product-db-url
      value: # Will be set during deployment
    - name: kafka-jaas-config
      value: # Will be set during deployment